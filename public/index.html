<!doctype html>
<html>

<head>
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, shrink-to-fit=no">
  <link rel="preload" href="./font/TerminusTTF-4.49.3.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <link rel="stylesheet" href="xterm/css/xterm.css" />
  <script src="xterm/lib/xterm.js"></script>
  <title>TRON — Games in the Shell</title>

  <style>
    @font-face {
      font-family: 'Terminus';
      src: url(./font/TerminusTTF-4.49.3.ttf);
    }

    body {
      padding: 0;
      margin: 0;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      background-color: #111;
      display: grid;
      place-items: center;
    }
  </style>
</head>

<body>
  <div id="terminal"></div>

  <script type="module">
    import init, { get_screen, key, reset, game_loop, Button } from './pkg/template.js';
    await init();

    const w = window.innerWidth, h = window.innerHeight;
    const fs = Math.min(18, Math.floor(Math.min(w / 80 * 2, h / 24)));

    const d = document.getElementById("terminal");
    d.style.width  = (fs * 40) + "px";
    d.style.height = (fs * 24) + "px";

    const term = new Terminal({
      cols: 80,
      rows: 24,
      fontFamily: 'Terminus, monospace',
      fontSize: fs,
      letterSpacing: 0,
      lineHeight: 1,
      rendererType: 'canvas',
      cursorStyle: 'block',
      cursorBlink: false,
      theme: {
        background: '#000',
        foreground: '#ccc',
      },
    });
    term.open(d);

    const decoder = new TextDecoder();

    function render() {
      const bytes = get_screen();
      const text = decoder.decode(bytes);
      term.write('\x1b[H\x1b[?25l' + text);
    }

    // Initial render
    render();

    // Game loop: ~15 FPS
    setInterval(() => {
      game_loop();
      render();
    }, 67);

    // Keyboard input
    term.onKey(({ key: k, domEvent }) => {
      const code = domEvent.code;
      domEvent.preventDefault();
      switch (code) {
        // Player 1: WASD
        case 'KeyW': key(Button.Up);    break;
        case 'KeyD': key(Button.Right); break;
        case 'KeyS': key(Button.Down);  break;
        case 'KeyA': key(Button.Left);  break;
        // Player 2: IJKL
        case 'KeyI': key(Button.North); break;
        case 'KeyL': key(Button.East);  break;
        case 'KeyK': key(Button.South); break;
        case 'KeyJ': key(Button.West);  break;
        // Restart / quit
        case 'KeyR': reset(); render(); break;
      }
    });
  </script>
</body>

</html>
