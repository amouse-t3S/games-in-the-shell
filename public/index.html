<!doctype html>
<html>

<head>
  <meta name="viewport" content="width=640">
  <link rel="preload" href="./font/TerminusTTF-4.49.3.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <link rel="stylesheet" href="xterm/css/xterm.css" />
  <script src="xterm/lib/xterm.js"></script>
  <title>GAMES ON THE SHELL</title>

  <style>
    @font-face {
      font-family: 'Terminus';
      src: url(./font/TerminusTTF-4.49.3.ttf);
    }

    #terminal {
      width: 640px;
      height: 400px;
    }

    html,
    body {
      padding: 0;
      margin: 0;
      width: 640px;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="terminal"></div>

  <script type="module">
    import init, { get_screen } from './pkg/template.js';
    await init();

    var term = new Terminal({ cols: 80, rows: 25, fontFamily: 'Terminus', fontSize: 16, letterSpacing: 0, lineHeight: 1 });
    term.open(document.getElementById('terminal'));

    const result = get_screen();
    term.write(result);
  </script>
</body>

</html>
